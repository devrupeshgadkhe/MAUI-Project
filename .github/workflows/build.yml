name: Build Inventory App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-build-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  PROJECT: InventoryApp/InventoryApp.csproj
  APP_VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}

jobs:
  build-windows:
    name: Build Windows installer EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION_TAG }}".TrimStart('v', 'V')
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Tag must use vMAJOR.MINOR.PATCH, for example v1.0.1" }
          "version=$version" >> $env:GITHUB_OUTPUT
          $parts = $version.Split(".")
          "versionCode=$([int]$parts[0] * 1000000 + [int]$parts[1] * 1000 + [int]$parts[2])" >> $env:GITHUB_OUTPUT
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: InventoryApp/InventoryApp.csproj
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Restore Windows target
        run: dotnet restore ${{ env.PROJECT }} -p:TargetFramework=net9.0-windows10.0.19041.0
      - name: Publish Windows app
        run: dotnet publish ${{ env.PROJECT }} -f net9.0-windows10.0.19041.0 -c Release --no-restore -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} -p:ApplicationVersion=${{ steps.version.outputs.versionCode }} -o artifacts/windows
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build single-file Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" InventoryApp/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-Windows-Setup
          path: artifacts/release/*.exe
          if-no-files-found: error
          compression-level: 0

  build-android:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION_TAG }}".TrimStart('v', 'V')
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Tag must use vMAJOR.MINOR.PATCH, for example v1.0.1" }
          "version=$version" >> $env:GITHUB_OUTPUT
          $parts = $version.Split(".")
          "versionCode=$([int]$parts[0] * 1000000 + [int]$parts[1] * 1000 + [int]$parts[2])" >> $env:GITHUB_OUTPUT
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: InventoryApp/InventoryApp.csproj
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restore Android target
        run: dotnet restore ${{ env.PROJECT }} -p:TargetFramework=net9.0-android
      - name: Publish APK
        run: dotnet publish ${{ env.PROJECT }} -f net9.0-android -c Release --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false -p:PublishReadyToRun=false -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} -p:ApplicationVersion=${{ steps.version.outputs.versionCode }} -o artifacts/android
      - name: Name versioned APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem artifacts/android -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw "APK was not produced" }
          Move-Item $apk.FullName "artifacts/android/InventoryApp-Android-v${{ steps.version.outputs.version }}.apk" -Force
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-Android-APK
          path: artifacts/android/InventoryApp-Android-*.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: InventoryApp-Windows-Setup
          path: windows
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: InventoryApp-Android-APK
          path: android
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Inventory App ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            windows/*.exe
            android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
