name: Build Inventory App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore InventoryApp/InventoryApp.csproj
      - name: Publish Windows app
        run: dotnet publish InventoryApp/InventoryApp.csproj -f net9.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o artifacts/windows
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath InventoryApp-Windows-x64.zip -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-Windows-x64
          path: InventoryApp-Windows-x64.zip

  build-android:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore InventoryApp/InventoryApp.csproj
      - name: Publish APK
        run: dotnet publish InventoryApp/InventoryApp.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false -o artifacts/android
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-Android-APK
          path: artifacts/android/*.apk

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: InventoryApp-Windows-x64
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: InventoryApp-Android-APK
          path: android
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            InventoryApp-Windows-x64.zip
            android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
