name: Build Inventory App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  PROJECT: InventoryApp/InventoryApp.csproj

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: InventoryApp/InventoryApp.csproj
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Restore Windows target
        run: dotnet restore ${{ env.PROJECT }} -p:TargetFramework=net9.0-windows10.0.19041.0
      - name: Publish Windows app
        run: dotnet publish ${{ env.PROJECT }} -f net9.0-windows10.0.19041.0 -c Release --no-restore -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false -o artifacts/windows
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath InventoryApp-Windows-x64.zip -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-Windows-x64
          path: InventoryApp-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  build-android:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: InventoryApp/InventoryApp.csproj
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restore Android target
        run: dotnet restore ${{ env.PROJECT }} -p:TargetFramework=net9.0-android
      - name: Publish APK
        run: dotnet publish ${{ env.PROJECT }} -f net9.0-android -c Release --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false -p:PublishReadyToRun=false -o artifacts/android
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-Android-APK
          path: artifacts/android/*.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: InventoryApp-Windows-x64
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: InventoryApp-Android-APK
          path: android
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            InventoryApp-Windows-x64.zip
            android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
